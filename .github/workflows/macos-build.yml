name: Build macOS App

on:
  push:
    branches:
      - main
      - master
      - mathpad-session-updates
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 🍎 Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: 📦 Install Dependencies
        run: |
          cd jyamiti
          flutter pub get

      - name: 🚀 Build macOS Release
        run: |
          cd jyamiti
          flutter build macos --release

      - name: 🗜️ Compress App to ZIP
        run: |
          cd jyamiti/build/macos/Build/Products/Release/
          zip -r JyamitiApp.zip *.app

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jyamiti
          path: jyamiti/build/macos/Build/Products/Release/JyamitiApp.zip
